# Rebuilds web/index.html from source and publishes it to GitHub Pages.
#
# The site is a single self-contained file, so "deploy" is just: run the
# esbuild bundle, then upload web/ as the Pages artifact. Building here rather
# than trusting the committed index.html means the published page can never
# drift from web/src/.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the self-contained page
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Fail if the build produced nothing usable
        run: test -s web/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
